<title>Прототип Packetwall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..760&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one emulated phone screen centered on a quiet page; the app inside is a flat MD3 (Graphite / baseline blue) UI. */
:root{
  --page:#E6E8F0; --bezel:#1B1D22;
  --bg:#F9F9FF; --s1:#F1F2F9; --s2:#EAEBF3; --s3:#E2E3EC; --s4:#D7D9E3;
  --on:#191C20; --on2:#44474E; --mu:#74777F; --ln:#DFE1E9; --ol:#C4C6D0;
  --pri:#415F91; --onp:#FFFFFF; --pc:#D6E3FF; --onpc:#001B3E; --sc:#DAE2F9; --onsc:#131C2B;
  --er:#BA1A1A; --erc:#FFDAD6; --oner:#410002; --ok:#2E6B3A; --okc:#C7EFCF; --onok:#062010;
  --te:#6B4FA3; --tec:#EADDFF; --onte:#25005A; --wa:#7A5300; --wac:#FFDEA8;
  --scrim:rgba(0,0,0,.32); --shadow:rgba(0,0,0,.18);
  --font:"Roboto Flex","Noto Sans",system-ui,sans-serif;
  --mono:"JetBrains Mono","Noto Sans Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.2,0,0,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#08090B; --bezel:#000;
  --bg:#111318; --s1:#191C21; --s2:#1F2228; --s3:#282B32; --s4:#33363E;
  --on:#E2E2E9; --on2:#C4C6D0; --mu:#8E9099; --ln:#2A2D34; --ol:#44474E;
  --pri:#AAC7FF; --onp:#0A305F; --pc:#284777; --onpc:#D6E3FF; --sc:#3E4759; --onsc:#DAE2F9;
  --er:#FFB4AB; --erc:#93000A; --oner:#FFDAD6; --ok:#8BD89A; --okc:#1D4A29; --onok:#BFF3C8;
  --te:#D8BDFF; --tec:#433366; --onte:#EEDCFF; --wa:#F1C27D; --wac:#4D3610;
  --scrim:rgba(0,0,0,.5); --shadow:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#08090B; --bezel:#000;
  --bg:#111318; --s1:#191C21; --s2:#1F2228; --s3:#282B32; --s4:#33363E;
  --on:#E2E2E9; --on2:#C4C6D0; --mu:#8E9099; --ln:#2A2D34; --ol:#44474E;
  --pri:#AAC7FF; --onp:#0A305F; --pc:#284777; --onpc:#D6E3FF; --sc:#3E4759; --onsc:#DAE2F9;
  --er:#FFB4AB; --erc:#93000A; --oner:#FFDAD6; --ok:#8BD89A; --okc:#1D4A29; --onok:#BFF3C8;
  --te:#D8BDFF; --tec:#433366; --onte:#EEDCFF; --wa:#F1C27D; --wac:#4D3610;
  --scrim:rgba(0,0,0,.5); --shadow:rgba(0,0,0,.6); color-scheme:dark}

html,body{height:100%}
body{background:var(--page);color:var(--on);font-family:var(--font);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-sizing:border-box;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.device{position:relative;width:min(392px,100%);height:min(840px,calc(100% - 34px));background:var(--bg);border-radius:34px;overflow:hidden;
  box-shadow:0 0 0 10px var(--bezel),0 30px 70px -20px var(--shadow);display:flex;flex-direction:column;isolation:isolate}
.hint{font-size:12.5px;color:var(--mu);text-align:center;max-width:560px;line-height:1.4}
@media (max-width:440px){.device{border-radius:22px;box-shadow:0 0 0 1px var(--ln)} .hint{display:none} .device{height:calc(100% - 4px)}}
.statusbar{height:28px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 24px;font-size:12.5px;font-weight:600;color:var(--on2);background:var(--bg);z-index:3;font-variant-numeric:tabular-nums}
.statusbar .r{display:flex;gap:6px;align-items:center}
.gesture{height:18px;flex:none;display:grid;place-items:center;background:var(--bg);z-index:3}
.gesture i{width:108px;height:4px;border-radius:2px;background:var(--on2);opacity:.55}
.stage{position:relative;flex:1;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);will-change:transform}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes inR{from{transform:translateX(28%);opacity:0}to{transform:none;opacity:1}}
@keyframes outL{from{transform:none;opacity:1}to{transform:translateX(-10%);opacity:.4}}
@keyframes inL{from{transform:translateX(-10%);opacity:.4}to{transform:none;opacity:1}}
@keyframes outR{from{transform:none;opacity:1}to{transform:translateX(28%);opacity:0}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.a-inR{animation:inR .28s var(--ease) both}.a-outL{animation:outL .28s var(--ease) both}
.a-inL{animation:inL .26s var(--ease) both}.a-outR{animation:outR .24s var(--ease) both}
.a-fade{animation:fadeIn .22s var(--ease) both}
@media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important;transition-duration:1ms!important}}

/* app bar */
.ab{height:56px;flex:none;display:flex;align-items:center;gap:2px;padding:0 4px}
.ab .tt{flex:1;min-width:0;padding-left:6px}
.ab .tt b{display:block;font-size:20px;font-weight:650;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab .tt b.mono{font-family:var(--mono);font-size:15.5px;font-weight:600}
.ab .tt span{display:block;font-size:12px;color:var(--mu);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab .tt span.p{color:var(--pri);font-weight:600;cursor:pointer}
.ib{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--on2);flex:none;transition:background .15s}
.ib:hover{background:var(--s2)}.ib:active{background:var(--s3)}
.ib.dis{opacity:.35;pointer-events:none}
.txtbtn{font-size:14px;font-weight:650;color:var(--pri);padding:8px 12px;border-radius:18px}
.txtbtn:active{background:var(--s2)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.s{width:18px;height:18px}svg.xs{width:14px;height:14px}
.spin svg{animation:spin .9s linear infinite}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

/* generic */
.pad{padding:0 12px 16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px}.grow{flex:1;min-width:0}
.mono{font-family:var(--mono)}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu{color:var(--mu)}.on2{color:var(--on2)}.ert{color:var(--er)}
.card{background:var(--s1);border-radius:16px;padding:12px}
.lbl{font-size:11px;font-weight:650;color:var(--mu);letter-spacing:.35px;text-transform:uppercase}
.hd{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 0}
.hd b{font-size:13px;font-weight:700;color:var(--on2)}
.hd button{font-size:12.5px;font-weight:650;color:var(--pri)}
.t1{font-size:13.5px;font-weight:600}.t2{font-size:11.5px;color:var(--mu);margin-top:1px}
.num{font-variant-numeric:tabular-nums}
.av{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:750;color:#fff;flex:none}
.av.md{width:32px;height:32px;border-radius:9px;font-size:13px}
.av.l{width:36px;height:36px;border-radius:10px;font-size:14px}
.av.xl{width:40px;height:40px;border-radius:12px;font-size:16px}
.ls{background:var(--s1);border-radius:16px;overflow:hidden}
.r2{display:flex;align-items:center;gap:10px;padding:6px 10px;min-height:42px;border-top:1px solid var(--ln);width:100%;text-align:left;transition:background .15s}
.r2:first-child{border-top:0}
button.r2:active,.tap:active{background:var(--s2)}
.r2 .pt{font-family:var(--mono);font-size:12.5px}
.r2 .mt{font-size:11px;color:var(--mu);margin-top:1px}
.tg{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px;white-space:nowrap}
.tg.er{background:var(--erc);color:var(--oner)}.tg.ok{background:var(--okc);color:var(--onok)}
.tg.p{background:var(--pc);color:var(--onpc)}.tg.te{background:var(--tec);color:var(--onte)}
.tg.g{background:var(--s3);color:var(--on2)}.tg.wa{background:var(--wac);color:var(--wa)}
.tb{font-size:12px;font-weight:650;color:var(--pri);border:1px solid var(--ol);border-radius:8px;padding:4px 9px;white-space:nowrap;flex:none}
.tb:active{background:var(--sc)}
.seg{display:flex;border:1px solid var(--ol);border-radius:10px;overflow:hidden;flex:none;height:34px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--on2);border-left:1px solid var(--ol);white-space:nowrap;padding:0 6px;transition:background .2s,color .2s}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--sc);color:var(--onsc)}
.seg.dis{opacity:.4;pointer-events:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.ch{height:30px;border:1px solid var(--ol);border-radius:8px;display:flex;align-items:center;gap:5px;padding:0 10px;font-size:12.5px;font-weight:600;color:var(--on2);white-space:nowrap;flex:none;transition:background .2s}
.ch.on{background:var(--sc);color:var(--onsc);border-color:transparent;padding-left:7px}
.tabs{display:flex;border-bottom:1px solid var(--ln);flex:none;padding:0 6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:10px 10px 11px;font-size:13.5px;font-weight:650;color:var(--mu);position:relative;white-space:nowrap;display:flex;gap:5px;align-items:center;flex:none}
.tabs button em{font-style:normal;font-size:10.5px;background:var(--s3);color:var(--on2);border-radius:6px;padding:0 5px}
.tabs button.on{color:var(--pri)}
.tabs button.on em{background:var(--pc);color:var(--onpc)}
.tabs button.on:after{content:"";position:absolute;left:6px;right:6px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--pri);animation:fadeIn .2s var(--ease)}
.tabs.fill button{flex:1;justify-content:center}
.sw{width:42px;height:26px;border-radius:13px;background:var(--s4);position:relative;flex:none;border:2px solid var(--mu);transition:background .2s,border-color .2s}
.sw:after{content:"";position:absolute;width:12px;height:12px;border-radius:6px;background:var(--mu);left:5px;top:5px;transition:all .2s var(--ease)}
.sw.on{background:var(--pri);border-color:var(--pri)}
.sw.on:after{width:18px;height:18px;border-radius:9px;left:18px;top:2px;background:var(--onp)}
.empty{padding:28px 20px;text-align:center;color:var(--mu);font-size:13px;line-height:1.45}

/* home (C) */
.pw{width:60px;height:60px;border-radius:20px;background:var(--pri);color:var(--onp);display:grid;place-items:center;flex:none;transition:all .3s var(--ease)}
.pw svg{width:28px;height:28px;stroke-width:2.4}
.pw.off{background:var(--s3);color:var(--on2);border-radius:30px}
.st{font-size:17px;font-weight:700}
.st i{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--ok);margin-right:6px;vertical-align:2px;transition:background .3s}
.st.off i{background:var(--mu)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--s1);border-radius:16px;padding:10px 12px;text-align:left;transition:background .15s,opacity .3s}
.tile:active{background:var(--s2)}
.tile b{display:block;font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .ic2{color:var(--pri);margin-bottom:2px}
.muted{opacity:.45}

/* logs (D) */
.fld{height:40px;border:1px solid var(--ol);border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;flex:none;transition:border-color .2s}
.fld:focus-within{border-color:var(--pri)}
.fld input{flex:1;min-width:0;border:0;outline:0;background:none;font-family:var(--mono);font-size:12.5px}
.fld input::placeholder{color:var(--mu)}
.fld.bad{border-color:var(--er)}
.cn{display:flex;gap:10px;padding:4px 12px 4px 8px;border-bottom:1px solid var(--ln);align-items:center;min-height:44px;width:100%;text-align:left}
.cn:active{background:var(--s2)}
.cn .ic{width:32px;display:flex;justify-content:center;flex:none}
.cn .a{font-size:13px;font-weight:600}
.cn .h{font-family:var(--mono);font-size:11.5px;color:var(--on2);margin-top:1px}
.cn.bl .h{color:var(--er)}
.cn .m{font-size:11px;color:var(--mu);text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-variant-numeric:tabular-nums}
.compact .cn{min-height:36px}
.compact .cn .a{display:none}
.compact .cn .h{font-size:12px;margin:0}
.compact .r2{min-height:34px;padding-block:3px}
/* log rows: detailed = PCAPdroid (variant 1), compact = two lines (variant 2) */
.av.rd{border-radius:50%}
.c1{display:flex;gap:14px;padding:7px 12px 7px 10px;border-bottom:1px solid var(--ln);align-items:center;width:100%;text-align:left}
.c1:active,.c2:active{background:var(--s2)}
.c1 .a{font-size:14.5px;font-weight:650;color:var(--on2)}
.c1 .p,.c1 .h{font-size:13px;color:var(--mu);margin-top:1px}
.c1 .r{text-align:right;font-size:12.5px;color:var(--mu);display:flex;flex-direction:column;gap:1px;align-items:flex-end;flex:none;font-variant-numeric:tabular-nums}
.c1 .r .z{font-size:14.5px;color:var(--on2)}
.st-a{color:var(--ok)}.st-c{color:var(--mu)}.st-b{color:var(--er);font-weight:650;display:flex;align-items:center;gap:3px}
.c2{display:flex;gap:12px;padding:5px 12px 5px 10px;border-bottom:1px solid var(--ln);align-items:center;min-height:46px;position:relative;width:100%;text-align:left}
.c2 .l1,.c2 .l2{display:flex;gap:8px;align-items:baseline}
.c2 .l2{margin-top:1px}
.c2 .a{font-size:13.5px;font-weight:650;color:var(--on2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c2 .t{font-size:11.5px;color:var(--mu);font-variant-numeric:tabular-nums;flex:none}
.c2 .h{font-size:12.5px;color:var(--mu);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c2 .h b{font-weight:500;color:var(--on2)}
.c2 .z{font-size:12px;color:var(--on2);font-variant-numeric:tabular-nums;flex:none}
.c2.bl:before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--er)}
.c2.bl .t{color:var(--er)}
.c2.ac .t{color:var(--ok)}

/* details */
.kv{display:grid;grid-template-columns:118px 1fr;font-size:13px}
.kv>div{padding:7px 12px;border-bottom:1px solid var(--ln);min-width:0;overflow-wrap:anywhere}
.kv>div:nth-child(odd){color:var(--mu)}
.why{background:var(--erc);color:var(--oner);font-size:12.5px;padding:8px 12px;display:flex;gap:10px;align-items:flex-start;flex:none}
.why.okb{background:var(--sc);color:var(--onsc)}
.why button{color:inherit;font-weight:700;text-decoration:underline;white-space:nowrap}
.pk{display:grid;grid-template-columns:20px 84px 14px 1fr 34px;gap:6px;align-items:center;font-family:var(--mono);font-size:11.3px;padding:8px 12px;border-bottom:1px solid var(--ln);color:var(--on2);width:100%;text-align:left}
.pk:active{background:var(--s2)}
.pk .up{color:var(--wa);font-weight:700}.pk .dn{color:var(--pri);font-weight:700}.pk .x{color:var(--er);font-weight:700}
.pk .r{text-align:right;color:var(--mu)}
.tree{font-family:var(--mono);font-size:11.6px;line-height:1.5;color:var(--on2);padding:6px 8px;flex:none}
.tree button{display:block;width:100%;text-align:left;padding:3px 4px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree button.sel{background:var(--pc);color:var(--onpc)}
.tree .x{color:var(--mu)}
.tl{padding:10px 12px 6px;border-bottom:1px solid var(--ln);flex:none;user-select:none}
.tl .row2{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mu);gap:8px}
.tl svg{width:100%;height:58px;display:block;margin:4px 0;touch-action:none;cursor:crosshair}
.tl .clr{color:var(--pri);font-weight:650;font-size:11.5px}
.p5{display:flex;align-items:center;gap:10px;padding:5px 12px;border-bottom:1px solid var(--ln);width:100%;text-align:left;min-height:42px}
.p5:active{background:var(--s2)}
.p5 .n{width:18px;font-family:var(--mono);font-size:11px;color:var(--mu);flex:none}
.p5 .d{font-weight:700;width:12px;flex:none}
.p5 .d.up{color:var(--wa)}.p5 .d.dn{color:var(--pri)}.p5 .d.x{color:var(--er)}
.p5 .l1{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p5 .l2{font-size:10.8px;color:var(--mu);font-family:var(--mono);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p5 .z{font-family:var(--mono);font-size:11px;color:var(--on2);flex:none}
.p5.drop .l1{color:var(--er)}
.split{height:8px;background:var(--s1);border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);flex:none}
.hex{font-family:var(--mono);font-size:11px;line-height:1.6;white-space:pre;color:var(--on);padding:6px 12px 14px}
.hex .o{color:var(--mu)}.hex .h{background:var(--pc);color:var(--onpc);border-radius:2px}
.chk{border-bottom:1px solid var(--ln);padding:6px 12px 8px}
.chk .hl{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--mu)}
.dump{font-family:var(--mono);font-size:11px;line-height:1.5;white-space:pre;color:var(--on);margin-top:4px;overflow:hidden}
.dump.txt{white-space:pre-wrap;word-break:break-all}
.dump .o{color:var(--mu)}

/* overlays */
.ov{position:absolute;inset:0;z-index:20;pointer-events:none}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s;pointer-events:auto}
.ov.open .scrim{opacity:1}
.drw{position:absolute;left:0;top:0;bottom:0;width:min(300px,82%);background:var(--s1);border-radius:0 18px 18px 0;padding:14px 10px 10px;display:flex;flex-direction:column;gap:2px;transform:translateX(-102%);transition:transform .3s var(--ease);pointer-events:auto;overflow-y:auto}
.ov.open .drw{transform:none}
.drw .hdr{padding:6px 12px 14px;border-bottom:1px solid var(--ln);margin-bottom:8px}
.drw .hdr b{font-size:22px;font-weight:720}
.drw .it{display:flex;align-items:center;gap:14px;height:46px;border-radius:23px;padding:0 16px;font-size:14px;font-weight:600;color:var(--on2);width:100%;flex:none}
.drw .it:active{background:var(--s3)}
.drw .it.on{background:var(--pc);color:var(--onpc)}
.drw .it em{margin-left:auto;font-style:normal;font-size:12px;color:var(--mu);font-weight:600}
.drw .it.on em{color:var(--onpc)}
.drw .glbl{font-size:12px;font-weight:700;color:var(--pri);padding:8px 16px 4px;letter-spacing:.2px;flex:none}
.drw .sep{height:1px;background:var(--ln);margin:6px 12px;flex:none}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:82%;background:var(--s1);border-radius:24px 24px 0 0;padding:8px 0 14px;transform:translateY(102%);transition:transform .3s var(--ease);pointer-events:auto;display:flex;flex-direction:column}
.ov.open .sheet{transform:none}
.sheet .handle{width:32px;height:4px;border-radius:2px;background:var(--ol);margin:4px auto 8px;flex:none}
.sheet h3{font-size:17px;font-weight:650;padding:4px 20px 8px;margin:0}
.sheet .sc{overflow-y:auto}
.opt{display:flex;align-items:center;gap:14px;padding:11px 20px;width:100%;text-align:left;font-size:14px}
.opt:active{background:var(--s2)}

function globRe(pat,sub){
  let src=pat.toLowerCase().split('.').map(l=>l==='**'?'(?:[^.]+\\.)*[^.]+':l.replace(/[\\^$+?()[\]{}|]/g,'\\$&').replace(/\*/g,'[^.]*')).join('\\.');

}
function ip2n(ip){const p=ip.split('.').map(Number);return p.length===4&&p.every(x=>x>=0&&x<256)?((p[0]<<24)>>>0)+(p[1]<<16)+(p[2]<<8)+p[3]:null}
function cidrMatch(c,ip){const [b,l]=c.split('/');const n=ip2n(ip),m=ip2n(b);if(n===null||m===null)return false;const len=l===undefined?32:+l;const mask=len===0?0:(~0<<(32-len))>>>0;return ((n&mask)>>>0)===((m&mask)>>>0)}
function matches(r,c){
  if(!r.on)return false;
  try{
    switch(r.type){
      case 'all':return true;
      case 'host':return globRe(r.pat,r.sub).test(c.host);
      case 'ip':case 'cidr':return cidrMatch(r.pat,c.ip);
      case 'country':return r.pat.toUpperCase()===c.cc;
      case 'port':{const [p,po]=r.pat.split('/');return p===c.l4&&(po==='*'||+po===c.port)}
    }
  }catch(e){return false}
  return false;
}
function spec(r){
  if(r.type==='all')return 0;
  if(r.type==='country')return 10;
  if(r.type==='port')return 15;
  if(r.type==='cidr'||r.type==='ip'){const l=+(r.pat.split('/')[1]??32);return 20+l/2}
  const labels=r.pat.split('.');let s=100;labels.forEach(l=>{if(l==='**')s+=1;else if(l.includes('*'))s+=6;else s+=10});return s-(r.sub?3:0);
}
function best(rs){return rs.sort((a,b)=>spec(b)-spec(a)||(a.act==='b'?-1:1))[0]}
function setActive(s){return s.on}
function decide(c){
  if(!S.on)return {act:'a',rule:null,set:null,off:true};
  let gAllow=null;
  for(const s of allSets()){
    if(!setActive(s))continue;
    const appR=best(s.rules.filter(r=>r.who===c.app&&matches(r,c)));
    if(appR)return {act:appR.act,rule:appR,set:s};
    if(!gAllow){const g=best(s.rules.filter(r=>r.who==='*'&&matches(r,c)));
      if(g){if(g.act==='b')return {act:'b',rule:g,set:s};gAllow={act:'a',rule:g,set:s}}}
  }
  if(gAllow)return gAllow;
  return {act:'a',rule:null,set:null};
}

function parseFilter(q){

  const fs=parts.map(p=>{let m;
    if(m=p.match(/^app\s*==\s*"([^"]*)"$/i))return c=>APPS[c.app].n.toLowerCase()===m[1].toLowerCase();
    if(m=p.match(/^host\s*~\s*"([^"]*)"$/i)){const re=new RegExp(m[1],'i');return c=>re.test(c.host)}
    if(m=p.match(/^host\s*==\s*"([^"]*)"$/i))return c=>c.host===m[1];
    if(m=p.match(/^ip\s*==\s*"?([\d./]+)"?$/i))return c=>cidrMatch(m[1],c.ip);
    if(m=p.match(/^proto\s*==\s*"?([\w .]+)"?$/i))return c=>c.proto.toLowerCase().startsWith(m[1].toLowerCase());
    if(m=p.match(/^bytes\s*>\s*(\d+)\s*([kKмМmM]?)$/)){const k={'k':1024,'K':1024,'m':1048576,'M':1048576,'м':1048576,'М':1048576}[m[2]]||1;return c=>c.up+c.down>+m[1]*k}

    if(m=p.match(/^cc\s*==\s*"?(\w\w)"?$/i))return c=>c.cc===m[1].toUpperCase();
    throw new Error('bad');});
  return c=>fs.every(f=>f(c));

function packetsOf(c){

  return P.map((p,i)=>{ms+=i===0?0:[1,22,0,2,25,40,1,22][i]||5;const pl=Math.max(0,p[2]-52);const seq=p[0]==='↑'?su:sd,ack=p[0]==='↑'?sd:su;

function appState(a){
  const rs=sets().filter(setActive).flatMap(s=>s.rules).filter(r=>r.who===a&&r.on);
  const conns=CONNS.filter(c=>c.app===a);const bl=conns.filter(blocked).length;
  if(!S.on)return ['g','выкл.'];
  if(S.up&&a===S.upApp)return ['g','мимо VPN'];
  const all=rs.find(r=>r.type==='all');
  if(all&&all.act==='b'&&!rs.some(r=>r.act==='a'))return ['er','нет сети'];
  if(bl&&bl<conns.length)return ['wa','частично'];
  if(bl&&bl===conns.length)return ['er','нет сети'];
  if(rs.some(r=>r.act==='a'))return ['p','исключение'];
  return null;
}
SCREENS.firewall=p=>{

  apps=apps.filter(a=>S.fwSet==='*'||rulesIn(a,S.fwSet).length);

   body:`<div class="pad" style="padding-top:10px"><div class="ls">${apps.map(a=>{const n=rulesIn(a,'*').length;const tr=CONNS.filter(c=>c.app===a&&!blocked(c)).reduce((s,c)=>s+c.up+c.down,0);const st=appState(a);

SCREENS.sets.after=el=>{
  el.querySelectorAll('[data-drag]').forEach(h=>h.addEventListener('pointerdown',e=>{
    e.preventDefault();const row=h.closest('.dragrow');const list=row.parentElement;const kind=row.dataset.kind;const rows=[...list.children];
    const from=+row.dataset.idx;const hgt=row.offsetHeight;const y0=e.clientY;let to=from;row.classList.add('lift');try{h.setPointerCapture(e.pointerId)}catch(x){}
    const mv=ev=>{const dy=ev.clientY-y0;row.style.transform=`translateY(${dy}px)`;to=Math.max(0,Math.min(rows.length-1,from+Math.round(dy/hgt)));
      rows.forEach((r,i)=>{if(r===row)return;let sh=0;if(from<to&&i>from&&i<=to)sh=-hgt;if(from>to&&i<from&&i>=to)sh=hgt;r.style.transform=sh?`translateY(${sh}px)`:''})};
    const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);
      const arr=kind==='set'?sets():FILTERS;if(to!==from){const [it]=arr.splice(from,1);arr.splice(to,0,it);snack(`«${it.name}» теперь на месте ${to+1}`)}
      refreshAll()};
    h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up)}))};

function addRule(r){const s=setById(r.set);s.rules.unshift(r);return ()=>{const i=s.rules.indexOf(r);if(i>=0)s.rules.splice(i,1)}}
const A={
 drawer:()=>drawer(),
 closeOv:()=>closeOverlay(),
 back:()=>back(),
 noop:()=>snack('В прототипе не реализовано'),
 nav:d=>{closeOverlay();const top=stack[stack.length-1];if(top&&top.name===d.to)return;go(d.to,{},{root:true})},
 power:()=>{S.on=!S.on;$('#sbVpn').hidden=!S.on;refreshAll();snack(S.on?'Защита включена':'Защита выключена')},
 profiles:()=>sheet('Профиль',PROFILES[S.mode].map(pr=>`<button type="button" class="opt" data-act="setProfile" data-v="${pr.id}"><span class="radio ${S.profile[S.mode]===pr.id?'on':''}"></span><div class="grow"><div>${pr.n}</div><div class="d">${pr.sets.map(id=>setById(id).name).join(', ')}</div></div></button>`).join('')),
 setProfile:d=>{S.profile[S.mode]=d.v;const pr=PROFILES[S.mode].find(p=>p.id===d.v);sets().forEach(s=>s.on=pr.sets.includes(s.id));closeOverlay();refreshAll();snack(`Профиль «${pr.n}»`)},
 saveProfile:()=>{const n='Профиль '+(PROFILES[S.mode].length+1);PROFILES[S.mode].push({id:'p'+Date.now(),n,sets:sets().filter(s=>s.on).map(s=>s.id)});S.profile[S.mode]=PROFILES[S.mode].at(-1).id;refreshAll();snack(`Сохранено как «${n}»`)},
 logsBlocked:()=>{S.logStatus='b';S.logTab='conns';go('logs',{},{root:true})},
 allowHost:d=>{const c=CONNS.find(x=>x.id==d.id);const undo=addRule({id:++RID,set:sets()[0].id,act:'a',who:'*',type:'host',pat:c.host,sub:false,block:'drop',on:true});refreshAll();snack(`Разрешено: ${c.host}`,undo)},
 conn:d=>{closeOverlay();S.pkSel=null;go('conn',{id:+d.id,tab:'ov'})},
 pkClear:()=>{S.pkSel=null;refresh()},
 connTab:d=>{cur().p.tab=d.v;refresh()},
 connStep:d=>{const e=cur();const i=CONNS.findIndex(c=>c.id==e.p.id)+(+d.d);if(i<0||i>=CONNS.length)return;e.p.id=CONNS[i].id;S.pkSel=null;refresh();e.el.classList.add('a-fade')},
 packet:d=>go('packet',{cid:+d.cid,i:+d.i}),
 pktStep:d=>{const e=cur();const c=CONNS.find(x=>x.id==e.p.cid);const pk=packetsOf(c).filter(x=>x.k!=='drop');const pos=pk.findIndex(x=>x.i==e.p.i)+(+d.d);if(pos<0||pos>=pk.length)return;e.p.i=pk[pos].i;e.p.sel=undefined;refresh();e.el.classList.add('a-fade')},
 treeSel:d=>{cur().p.sel=+d.i;refresh();scrollToHl(cur().el,true)},
 dataMode:d=>{S.dataMode=d.v;refresh()},
 copyChunk:()=>{try{navigator.clipboard.writeText('16 03 01 02 00 01 00 01 fc 03 03').then(()=>snack('Скопировано'),()=>snack('Буфер обмена недоступен'))}catch(e){snack('Буфер обмена недоступен')}},
 logStatus:d=>{S.logStatus=d.v;refresh()},
 logTab:d=>{S.logTab=d.v;refresh()},
 clearFlt:()=>{S.logFilter='';refresh()},
 compact:()=>{closeOverlay();S.compact=!S.compact;refreshAll()},
 pause:()=>{S.paused=!S.paused;refresh();snack(S.paused?'Захват на паузе':'Захват продолжается')},
 exportLog:()=>sheet('Экспорт',[['pcapng','с метаданными приложений'],['pcapng (отфильтрованное)','только соединения под фильтр'],['JSON','для своих скриптов'],['CSV','таблица соединений'],['Трансляция на ПК','pcap-over-IP · порт 57012']].map(([t,dd])=>`<button type="button" class="opt" data-act="exported" data-v="${t}">${I('share','s')}<div class="grow"><div>${t}</div><div class="d">${dd}</div></div></button>`).join('')),
 exported:d=>{closeOverlay();snack(d.v==='Трансляция на ПК'?'Ожидание подключения Wireshark: 192.168.1.37:57012':`Экспорт: ${d.v}`)},
 logMenu:()=>menu([{t:'Компактные строки',act:'compact',icon:'density',ck:S.compact},{t:'Очистить журнал',act:'noop',icon:'trash'},{t:'Справка по фильтрам',act:'fltHelp',icon:'info'}]),
 fltHelp:()=>{closeOverlay();sheet('Фильтры',`<div style="padding:0 20px 10px;font-size:13px;line-height:1.7" class="mono">app == "T-Bank"<br>host ~ "rtb|stat"<br>host == "api.vk.ru"<br>ip == 178.130.0.0/16<br>proto == QUIC<br>bytes &gt; 1M<br>cc == RU<br>blocked · !blocked<br>условия через &amp;&amp;</div>`)},
 refreshFilters:()=>{const b=$('#refBtn',cur().el);b.classList.add('spin');setTimeout(()=>{b.classList.remove('spin');FILTERS.forEach(f=>{if(f.on&&f.upd)f.upd='14.11 20:41'});refresh();snack(`Обновлено ${FILTERS.filter(f=>f.on&&f.upd).length} списка`)},1300)},
 filtCat:d=>{S.filtCat=d.v;refresh()},
 toggleFilter:d=>{const f=FILTERS.find(x=>x.id===d.id);f.on=!f.on;refreshAll()},
 openFilter:d=>{const f=FILTERS.find(x=>x.id===d.id);sheet(f.name,`<div style="padding:0 20px 8px;font-size:13px;color:var(--on2);line-height:1.6">${fmtN(f.count)} правил${f.skipped?', пропущено при конвертации '+fmtN(f.skipped):''}<br>${f.url?`<span class="mono" style="font-size:11.5px;overflow-wrap:anywhere">${esc(f.url)}</span><br>`:'файл, без автообновления<br>'}Приоритет ${prioOf(f)} · ${f.on?'включён':'выключен'}</div><button type="button" class="opt" data-act="toggleFilter" data-id="${f.id}">${I(f.on?'close':'check','s')}${f.on?'Выключить':'Включить'}</button><button type="button" class="opt" data-act="nav" data-to="sets" data-push="1">${I('layers','s')}Изменить приоритет</button><button type="button" class="opt" data-act="noop" style="color:var(--er)">${I('trash','s')}Удалить</button>`)},
 importSheet:()=>sheet('Импорт: исходный формат',[['hosts','0.0.0.0 example.com'],['Список доменов','один домен на строку'],['uBlock Origin / AdGuard','||x^, @@||x^, $app=, $important'],['CIDR-список','IP и подсети'],['PCAPdroid','JSON-экспорт правил'],['NetGuard / AFWall+ / RethinkDNS','экспорт приложений и хостов'],['sing-box rule-set','.json / .srs']].map(([t,dd])=>`<button type="button" class="opt" data-act="importFmt" data-v="${t}">${I('import','s')}<div class="grow"><div>${t}</div><div class="d">${dd}</div></div></button>`).join('')),
 importFmt:d=>{closeOverlay();const f={id:'f'+Date.now(),kind:'filter',name:'Импорт: '+d.v,on:true,count:1284,cat:'own',imp:1,skipped:d.v.startsWith('uBlock')?211:0,dom:[],rules:[]};FILTERS.push(f);setTimeout(()=>{refreshAll();snack(`Импортировано 1 284 правила в набор с приоритетом ${prioOf(f)}`)},320)},
 addUrl:()=>sheet('Список по URL',`<div class="form" style="padding-top:0"><div class="ff"><label for="newUrl">Адрес списка</label><input id="newUrl" class="mono" placeholder="https://…/list.txt"></div><div class="row"><span class="t2 grow" style="margin:0">Формат определится автоматически</span><button type="button" class="tb" data-act="importFmt" data-v="URL-список">Добавить</button></div></div>`),
 ruleSet:d=>{S.ruleSet=d.v;S.ruleSearch=null;refresh()},
 ruleType:d=>{S.ruleType=d.v;refresh()},
 ruleSearch:()=>{S.ruleSearch=S.ruleSearch===null?'':null;refresh()},
 ruleSearchM:()=>{closeOverlay();S.ruleSearch='';refresh()},
 rulesMenu:()=>menu([{t:'Поиск в наборе',act:'ruleSearchM',icon:'search'},{t:'Порядок наборов',act:'nav',data:'data-to="sets" data-push="1"',icon:'layers'},{t:'Настроить набор',act:'editSet',data:`data-id="${S.ruleSet}"`,icon:'gear'},{t:'Импорт в набор',act:'importSheet',icon:'import'},{t:'Экспорт набора',act:'exportLog',icon:'share'}]),
 newRule:d=>{closeOverlay();const who=d.who||'*';go('ruleEdit',{draft:{id:null,set:who==='*'?S.ruleSet:sets()[0].id,act:'b',who,type:who==='*'?S.ruleType:'host',pat:'',sub:false,block:S.fwDefault,on:true}})},
 newRuleFor:d=>{const c=CONNS.find(x=>x.id==d.id);go('ruleEdit',{draft:{id:null,set:sets()[0].id,act:blocked(c)?'a':'b',who:'*',type:'host',pat:c.host,sub:false,block:S.fwDefault,on:true}})},
 editRule:d=>{closeOverlay();const r=ruleById(d.id);if(!r)return;if(setById(r.set).kind==='filter'){A.openFilter({id:r.set});return}go('ruleEdit',{id:r.id,draft:{...r}})},
 draft:d=>{const dr=cur().p.draft;const pat=$('#pat',cur().el);if(pat)dr.pat=pat.value.trim();dr[d.k]=d.k==='sub'||d.k==='on'?!!d.v:d.v;if(d.k==='type'){dr.pat=dr.type==='all'?'*':''}refresh()},
 pickWho:()=>{const dr=cur().p.draft;sheet('Кто',[['*','Глобально','для всех приложений']].concat(Object.keys(APPS).map(a=>[a,APPS[a].n,APPS[a].p])).map(([k,t,dd])=>`<button type="button" class="opt" data-act="draftPick" data-k="who" data-v="${k}">${k==='*'?I('lang','s'):AV(k)}<div class="grow"><div>${t}</div><div class="d">${dd}</div></div>${dr.who===k?I('check','s'):''}</button>`).join(''))},
 pickSet:()=>{const dr=cur().p.draft;sheet('Набор',sets().map(s=>`<button type="button" class="opt" data-act="draftPick" data-k="set" data-v="${s.id}"><span class="prio">${prioOf(s)}</span><div class="grow"><div>${esc(s.name)}</div><div class="d">${s.rules.length} правил${s.on?'':' · выключен'}</div></div>${dr.set===s.id?I('check','s'):''}</button>`).join(''))},
 draftPick:d=>{const dr=cur().p.draft;const pat=$('#pat',cur().el);if(pat)dr.pat=pat.value.trim();dr[d.k]=d.v;if(d.k==='who'&&d.v==='*'&&dr.type==='all')dr.type='host';closeOverlay();refresh()},
 saveRule:()=>{const e=cur();const dr=e.p.draft;const pat=$('#pat',e.el);if(pat)dr.pat=pat.value.trim();
   if(dr.type!=='all'&&!dr.pat){snack('Заполните хост, адрес или порт');return}
   if(dr.type==='host'){try{globRe(dr.pat,dr.sub)}catch(x){snack('Маска не распознана');return}}
   if(e.p.id){const old=ruleById(e.p.id);const os=setById(old.set);os.rules.splice(os.rules.indexOf(old),1);setById(dr.set).rules.unshift({...dr,id:old.id})}
   else addRule({...dr,id:++RID});
   back();setTimeout(()=>{refreshAll();snack(e.p.id?'Правило сохранено':'Правило добавлено в «'+setById(dr.set).name+'»')},260)},
 delRule:()=>{const e=cur();const old=ruleById(e.p.id);const os=setById(old.set);const i=os.rules.indexOf(old);os.rules.splice(i,1);back();setTimeout(()=>{refreshAll();snack('Правило удалено',()=>os.rules.splice(i,0,old))},260)},
 fwSet:d=>{S.fwSet=d.v;refresh()},
 fwMenu:()=>menu([{t:'Скрыть приложения без правил',act:'fwHide',icon:'filter',ck:S.fwHideEmpty},{t:'Показывать системные',act:'fwSys',icon:'screen',ck:S.fwSys},{t:'Группы приложений',act:'noop',icon:'layers'}]),
 fwHide:()=>{S.fwHideEmpty=!S.fwHideEmpty;closeOverlay();refresh()},
 fwSys:()=>{S.fwSys=!S.fwSys;closeOverlay();refresh()},
 openApp:d=>{closeOverlay();go('app',{id:d.id})},
 toggleHost:d=>{const own=sets().find(x=>x.rules.some(r=>r.who===d.app&&r.type==='host'&&r.pat===d.host));
   if(own){const i=own.rules.findIndex(r=>r.who===d.app&&r.type==='host'&&r.pat===d.host);const [old]=own.rules.splice(i,1);refreshAll();snack(`Правило для ${d.host} удалено из «${own.name}»`,()=>own.rules.splice(i,0,old));return}
   const s=sets()[0];
   const c=CONNS.find(x=>x.app===d.app&&x.host===d.host);const act=blocked(c)?'a':'b';const undo=addRule({id:++RID,set:s.id,act,who:d.app,type:'host',pat:d.host,sub:false,block:S.fwDefault,on:true});refreshAll();
   snack(`${act==='a'?'Разрешено':'Запрещено'} для ${APPS[d.app].n} в «${s.name}»${blocked(c)===(act==='b')?'':' (перекрыто набором выше)'}`,undo)},
 editSet:d=>{closeOverlay();go('setEdit',{id:d.id})},
 toggleSet:d=>{const s=setById(d.id);s.on=!s.on;refreshAll()},
 openSetRules:d=>{S.ruleSet=d.id;go('rules',{},{root:true})},
 delSet:d=>{const ss=sets();if(ss.length<2){snack('Нельзя удалить последний набор');return}const i=ss.findIndex(s=>s.id===d.id);const [old]=ss.splice(i,1);back();setTimeout(()=>{refreshAll();snack(`Набор «${old.name}» удалён`,()=>ss.splice(i,0,old))},260)},
 newSet:()=>{const s={id:'s'+Date.now(),name:'Новый набор',on:true,cond:{},rules:[]};sets().push(s);refreshAll();go('setEdit',{id:s.id})},
 setSub:d=>go('settingsSub',{v:d.v}),
 setVal:d=>{closeOverlay();S[d.k]=d.v;if(d.k==='theme')applyTheme();refreshAll()},
 setBool:d=>{S[d.k]=!S[d.k];refreshAll()},
 pickUpApp:()=>sheet('Приложение-прокси',['singbox','v2rayng'].concat(Object.keys(APPS).filter(a=>!APPS[a].sys&&!['singbox','v2rayng'].includes(a))).map(a=>`<button type="button" class="opt" data-act="setVal" data-k="upApp" data-v="${a}">${AV(a)}<div class="grow"><div>${APPS[a].n}</div><div class="d">${APPS[a].p}</div></div>${S.upApp===a?I('check','s'):''}</button>`).join('')),
 upTest:()=>{const r=$('#upTestRes',cur().el);if(r)r.textContent='проверка…';setTimeout(()=>{const r2=$('#upTestRes',cur().el);const ok=/^\d+$/.test(S.upPort)&&S.upHost;if(r2){r2.style.color=ok?'var(--ok)':'var(--er)';r2.textContent=ok?`отвечает · 38 мс · внешний IP 203.0.113.24${S.upType==='socks5'&&S.upUdp?' · UDP ок':''}`:'не отвечает: проверьте адрес и порт'}},700)},
};
document.getElementById('dev').addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||t.closest('.dis'))return;
  const f=A[t.dataset.act];if(f){e.preventDefault();f(t.dataset,t)}
});

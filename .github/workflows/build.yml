name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Unit tests, lint, debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      # Signed release only when the repository has the signing secrets (see README → Building):
      # SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD.
      - name: Signing key
        id: signing
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        if: env.KEYSTORE != ''
        run: |
          dir="$GITHUB_WORKSPACE/../Packetwall-keys"
          mkdir -p "$dir"
          echo "$KEYSTORE" | base64 -d > "$dir/packetwall-release.jks"
          {
            echo "storeFile=$dir/packetwall-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$dir/keystore.properties"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Release APK
        if: steps.signing.outputs.signed == 'true'
        run: ./gradlew --no-daemon :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: packetwall-debug
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.signed == 'true'
        with:
          name: packetwall-release
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            app/build/reports/
          if-no-files-found: ignore
